{% extends "base.html" %}

{% block title %}See the Growth — Tags{% endblock %}

{% block content %}
<div class="tags-page">
  <h1>Tags</h1>

  {% if not tag_summaries %}
  <p class="tags-empty">No tags yet</p>
  {% else %}
  <ul class="tags-list">
    {% for tag in tag_summaries %}
    <li class="tags-item">
      <a href="/?tag={{ tag.name | urlencode }}" class="tags-item__name">{{ tag.name }}</a>
      <span class="tags-item__unfinished-count">{{ tag.unfinished_count }}</span>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
